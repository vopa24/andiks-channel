<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EE">
  <meta name="description" content="Check today's food, stock and prayer break status at Andik Cafe, Kolej 9 UTM.">
  <title>Andik's Channel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="student">
  <header class="app-header">
    <div class="header-inner">
      <div>
        <h1>Andik's Channel</h1>
        <p class="sub" id="cafe-line">Andik Cafe · Kolej 9 UTM</p>
      </div>
      <div class="header-actions">
        <button class="install-btn" id="install-btn" hidden>Install app</button>
        <!-- Shown when logged out: two separate buttons -->
        <a href="account.html#login" class="ghost-btn" id="login-link">Log in</a>
        <a href="account.html#signup" class="solid-btn" id="signup-link">Sign up</a>
        <!-- Shown when logged in -->
        <a href="account.html" class="ghost-btn" id="account-link" hidden>My account</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="status-card status-loading" id="status-card" aria-live="polite">
      <div class="status-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/></svg></div>
      <div class="status-text">
        <span class="status-badge" id="status-badge" hidden></span>
        <p class="status-title" id="status-title">Checking cafe status…</p>
        <p class="status-meta" id="status-meta"></p>
      </div>
    </section>

    <section class="menu">
      <div class="section-head">
        <h2>Today's food</h2>
        <span class="updated" id="menu-updated"></span>
      </div>
      <div id="menu-list" class="menu-list" aria-live="polite">
        <div class="food skeleton"></div><div class="food skeleton"></div>
      </div>
    </section>

    <section class="tip">
      <p>Check here before you walk to the cafe. Stock and status are updated by the cafe staff.</p>
    </section>
  </main>

  <footer class="app-footer">
    <a href="riders.html" class="staff-link">Want to be a rider? Register</a>
    <a href="login.html" class="staff-link" id="staff-link">Cafe staff? Log in</a>
  </footer>

  <!-- Cart bar (customers) -->
  <a href="cart.html" class="cart-bar" id="cart-bar" hidden>
    <span>View cart</span><span class="cart-bar-count" id="cart-bar-count">0</span>
  </a>

  <!-- Food details -->
  <div class="sheet-back" id="food-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fs-name">
      <button class="sheet-close" id="fs-close" aria-label="Close">✕</button>
      <div class="sheet-pic" id="fs-pic"></div>
      <h2 id="fs-name"></h2>
      <p class="sheet-stock" id="fs-stock"></p>
      <p class="sheet-desc" id="fs-desc"></p>
      <div class="sheet-actions" id="fs-actions"></div>
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
