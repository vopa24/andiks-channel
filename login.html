<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EE">
  <title>Staff login · Andik's Channel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-top">
    <a href="index.html" class="back">‹ Student view</a>
    <div class="emblem" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M32 52C32 52 12 42 12 22C24 22 32 30 32 52Z" fill="#BA3801"/><path d="M32 52C32 52 54 38 52 14C36 14 32 28 32 52Z" fill="#4A69B3"/><circle cx="32" cy="16" r="5" fill="#FFEC89"/></svg></div>
    <p class="brand">Andik's Channel</p>
    <p class="brand-sub">Andik Cafe · Kolej 9 UTM</p>
  </div>

  <main class="login-card">
    <form class="form" id="login-form" novalidate>
      <h1>Staff Log In</h1>
      <p class="sub">Only cafe staff can change stock and status</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="staff@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
        </div>
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary" id="login-btn" type="submit">Log In</button>
      <p class="hint" id="demo-hint" hidden>Demo mode: use any email and the password <b>andik123</b>.</p>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
