<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a0a26">
  <title>Staff login · Andik's Channel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <header class="app-header">
    <div class="header-inner">
      <div>
        <a href="index.html" class="back">‹ Student view</a>
        <h1>Staff login</h1>
        <p class="sub">Only cafe staff can change stock and status</p>
      </div>
    </div>
  </header>

  <main class="container">
    <form class="card form" id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="staff@example.com" required>
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">Show</button>
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary" id="login-btn" type="submit">Log in</button>
      <p class="hint" id="demo-hint" hidden>Demo mode: use any email and the password <b>andik123</b>.</p>
    </form>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
